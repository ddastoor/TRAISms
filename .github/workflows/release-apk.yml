name: Build & Publish TRAISms APK Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to publish (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Signed APK & Publish GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare Signing Keystores
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          SECRET_STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          SECRET_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # Generate debug.keystore expected by debugConfig
          if [ ! -f "debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          # Use repository release keystore secret if configured; otherwise generate a self-signed release key
          if [ -n "$RELEASE_KEYSTORE_BASE64" ] && [ -n "$SECRET_STORE_PASSWORD" ] && [ -n "$SECRET_KEY_PASSWORD" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > my-upload-key.jks
            echo "KEYSTORE_PATH=${GITHUB_WORKSPACE}/my-upload-key.jks" >> "$GITHUB_ENV"
            echo "STORE_PASSWORD=${SECRET_STORE_PASSWORD}" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=${SECRET_KEY_PASSWORD}" >> "$GITHUB_ENV"
          else
            EPHEMERAL_PASS="$(openssl rand -hex 24)"
            keytool -genkeypair -v \
              -keystore my-upload-key.jks \
              -storepass "$EPHEMERAL_PASS" \
              -alias upload \
              -keypass "$EPHEMERAL_PASS" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=TRAISms Release,O=TRAISms,C=US"
            echo "::add-mask::${EPHEMERAL_PASS}"
            echo "KEYSTORE_PATH=${GITHUB_WORKSPACE}/my-upload-key.jks" >> "$GITHUB_ENV"
            echo "STORE_PASSWORD=${EPHEMERAL_PASS}" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=${EPHEMERAL_PASS}" >> "$GITHUB_ENV"
          fi

      - name: Run Unit & Robolectric Verification Suite
        run: gradle :app:testDebugUnitTest

      - name: Assemble Signed Release & Debug APKs
        run: gradle :app:assembleRelease :app:assembleDebug

      - name: Verify Zero Internet Permissions in Merged Release Manifest
        run: |
          if grep -q "android.permission.INTERNET" app/build/intermediates/merged_manifests/release/processReleaseManifest/AndroidManifest.xml; then
            echo "ERROR: INTERNET permission detected in release manifest!"
            exit 1
          fi
          echo "Verified zero INTERNET permissions in merged release manifest."

      - name: Stage Release Artifacts & SHA-256 Checksums
        run: |
          mkdir -p release-dist
          cp app/build/outputs/apk/release/app-release.apk release-dist/TRAISms-v1.0.0-release.apk
          cp app/build/outputs/apk/debug/app-debug.apk release-dist/TRAISms-v1.0.0-debug.apk
          cd release-dist
          sha256sum TRAISms-v1.0.0-release.apk TRAISms-v1.0.0-debug.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload APK Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TRAISms-v1.0.0-APKs
          path: release-dist/*

      - name: Determine Release Tag
        id: tag_meta
        env:
          INPUT_RELEASE_TAG: ${{ github.event.inputs.release_tag }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
          elif [[ -n "$INPUT_RELEASE_TAG" && "$INPUT_RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$ ]]; then
            TAG_NAME="$INPUT_RELEASE_TAG"
          else
            TAG_NAME="v1.0.0"
          fi
          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"

      - name: Create or Update GitHub Release Page with APK Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_meta.outputs.tag_name }}
          name: "TRAISms ${{ steps.tag_meta.outputs.tag_name }} — 100% Offline Security-Hardened Android SMS"
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
          files: |
            release-dist/TRAISms-v1.0.0-release.apk
            release-dist/TRAISms-v1.0.0-debug.apk
            release-dist/SHA256SUMS.txt
